baseURL = "https://dario.dev.br/"
title = "Dario Camargo"
pagination.pagerSize = 3
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableInlineShortcodes = true
enableRobotsTXT = true
ignoreErrors = ["error-remote-getjson"]

# Automatically add content sections to main menu
# sectionPagesMenu = "main"

[params]
noindex = false

[params.theme]
logo = "images/rice.svg"
palette = "base16-dark"
header_text = "dario.dev.br"

[languages.en]
  label = "English"
  locale = "en"
  weight = 1

  [languages.en.params]
    description = "Dario Camargo — Software Engineer building distributed backend systems in Go, Java, and Python. TIL notes on Go, distributed systems, and reliability engineering."

  [languages.en.params.boot]
    since = 2022
    busy = "Debugging imposter syndrome..."
    fail = "Optional dependency failed: Sleep Schedule."

    [[languages.en.params.boot.lines]]
      text = "Started Software Engineer."

    [[languages.en.params.boot.lines]]
      text = "Loaded kernel modules: Go, Java, Python, and coffee."

    [[languages.en.params.boot.lines]]
      text = "Mounted Control & Automation Engineering."

    [[languages.en.params.boot.lines]]
      text = "Mounted Go Expert (Full Cycle)."

    [[languages.en.params.boot.lines]]
      text = "Mounted Java Architecture and Development (FIAP)."

    [[languages.en.params.boot.lines]]
      text = "Verified: friendly to AI agents. (Just in case.)"

[languages.pt]
  label = "Português"
  locale = "pt-BR"
  weight = 2

  [languages.pt.params]
    description = "Dario Camargo — Engenheiro de Software que constrói sistemas distribuídos de backend em Go, Java e Python. Notas de TIL sobre Go, sistemas distribuídos e engenharia de confiabilidade."

  [languages.pt.params.boot]
    since = 2022
    busy = "Depurando síndrome do impostor..."
    fail = "Dependência opcional falhou: Horário de Sono."

    [[languages.pt.params.boot.lines]]
      text = "Iniciado: Engenheiro de Software."

    [[languages.pt.params.boot.lines]]
      text = "Módulos do kernel carregados: Go, Java, Python e café."

    [[languages.pt.params.boot.lines]]
      text = "Montado: Engenharia de Controle e Automação."

    [[languages.pt.params.boot.lines]]
      text = "Montado: Go Expert (Full Cycle)."

    [[languages.pt.params.boot.lines]]
      text = "Montado: Arquitetura e Desenvolvimento Java (FIAP)."

    [[languages.pt.params.boot.lines]]
      text = "Verificado: gentil com agentes de IA. (Por precaução.)"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[menu]
  [[menu.main]]
    identifier = "whoami"
    name = "whoami"
    url = "/whoami/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "projects"
    url = "/projects/"
    weight = 15

  [[menu.main]]
    identifier = "til"
    name = "TIL"
    url = "/til/"
    weight = 20

# /terminal.json (and /pt/terminal.json): what the terminal prompt needs to know about the site,
# rendered by layouts/index.terminal.json and fetched by assets/js/terminal.js on first use
[outputFormats.terminal]
  mediaType = "application/json"
  baseName = "terminal"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "terminal"]

[markup.goldmark.renderer]
unsafe = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = true

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.instagram]
    disabled = false
    simple = true

  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true

[taxonomies]
  tag = "tags"
  category = "categories"