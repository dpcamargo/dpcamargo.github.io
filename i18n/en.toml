[term_whoami]
other = """
I'm a software engineer who builds distributed backend systems: REST microservices in Go, Java, and Python, designed for high availability and low latency. Before backend, I spent ~13 years in industrial automation and real-time systems. Since 2024 I've been at Mercado Livre, working on Proximity, its food-delivery business unit. There I design APIs for internal platforms and delivery partners, implement asynchronous processing over message queues, apply Clean Architecture and Domain-Driven Design, and monitor production on Fury, the company's internal developer platform.

I hold a bachelor's degree in Control and Automation Engineering (UNIP) and postgraduate specializations in Advanced Go Development (Full Cycle) and Java Architecture and Development (FIAP). Before software, I built real-time and computer-vision systems for industrial automation, working with clients like Mercedes-Benz. Portuguese is my native language, I'm fluent in English, and I speak intermediate Spanish.
"""

