{{ define "main" }}
    <header class="content__header">
        {{ .Content }}
    </header>
    <div class="content__body">

        {{ range .Pages }}
        <article class="post">
            <header class="post__header">
                <span class="til__date">(<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02/01/06" }}</time>) </span><a href="{{ .RelPermalink }}">{{ .Title | markdownify }}<p></p></a>
            </header>
        </article>
        {{ end }}
    </div>
{{ end }}
