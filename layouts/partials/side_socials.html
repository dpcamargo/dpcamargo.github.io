<section class="win side__socials">
    <header class="win__title">{{ i18n "side_socials_title" }}</header>
    <nav class="win__body socials__nav" aria-label="{{ i18n "socials_nav_label" }}">
        <div class="socials__list">
            <div class="socials__item">
                <a href="https://linkedin.com/in/dpcamargo" 
                   rel="me" 
                   aria-label="{{ i18n "linkedin_label" }}" 
                   title="{{ i18n "linkedin_title" }}" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="socials__link">
                    <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
                    <span class="socials__text">LinkedIn</span>
                </a>
            </div>
            <div class="socials__item">
                <a href="https://github.com/dpcamargo" 
                   rel="me" 
                   aria-label="{{ i18n "github_label" }}" 
                   title="{{ i18n "github_title" }}" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="socials__link">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                    <span class="socials__text">GitHub</span>
                </a>
            </div>
        </div>
    </nav>
</section>
