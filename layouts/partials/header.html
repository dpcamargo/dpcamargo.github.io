<nav class="main-nav">
    <ul>
    {{ $currentPage := . }}
    {{ range .Site.Menus.main }}
    <li class="main-nav__item"><a class="nav-main-item{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) (eq ($currentPage.Permalink) (.URL | absLangURL)) }} active{{end}}" href="{{ .URL | relLangURL }}" title="{{ .Title }}">{{ .Name }}</a></li>
    {{ end }}
    {{ partial "lang_switch.html" . }}
    <li class="main-nav__item palette-item">
        <details class="palette-picker">
            <summary id="palette-btn" class="btn" aria-label="{{ i18n "palette_label" }}">
                <span class="palette-btn__label">{{ i18n "palette_dark" }}</span>
            </summary>
            <div id="palette-popup" class="win palette-popup" role="group" aria-label="{{ i18n "palette_label" }}">
                <header class="win__title">{{ i18n "palette_title" }}</header>
                <div class="win__body">
                    <button type="button" class="palette-option" data-palette-value="dark" aria-pressed="false">{{ i18n "palette_dark" }}</button>
                    <button type="button" class="palette-option" data-palette-value="light" aria-pressed="false">{{ i18n "palette_light" }}</button>
                </div>
            </div>
        </details>
    </li>
    </ul>
</nav>
