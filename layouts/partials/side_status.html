<section class="win win--minimizable side__status">
    <header class="win__title">
        <h2 class="win__title-text">{{ i18n "side_status_title" }}</h2>
        <button type="button" class="win__minimize" aria-expanded="true" aria-label="{{ i18n "minimize_label" }}"></button>
        <button type="button" class="win__close" aria-label="{{ i18n "close_label" }}"></button>
    </header>
    <div class="win__body">
        <div class="status__line">
            <span class="status__dot"></span>
            <span class="status__label">{{ i18n "status_label" }}</span>
            <span class="status__value">{{ i18n "status_online" }}</span>
        </div>
        <div class="status__line">
            <span class="status__label">{{ i18n "location_label" }}</span>
            <span class="status__value">{{ i18n "location_value" }}</span>
        </div>
    </div>
</section>
