<div class="boot__line" style="--i: {{ .i }}">
    {{- if .busy -}}
    <span class="boot__tag">[ <span class="boot__busy">***</span> ]</span>
    {{- else -}}
    <span class="boot__tag">[  <span class="boot__ok">OK</span>  ]</span>
    {{- end }}
    <span class="boot__text">{{ .text }}</span>
</div>
